name: CI                      # имя проверки, просто подпись
on:
  push:                       # запускаться при каждом пуше
    branches: [main]          # в ветку main
jobs:
  test:                       # одна задача с именем test
    runs-on: ubuntu-latest    # на каком сервере крутить (свежая Ubuntu)
    steps:
      - uses: actions/checkout@v4        # шаг 1: скачать твой код
      - uses: actions/setup-python@v5    # шаг 2: поставить Python
        with:
          python-version: "3.12"
      - name: Install dependencies       # шаг 3: поставить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests                  # шаг 4: запустить тесты
        run: python manage.py test
